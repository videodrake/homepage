<!--@layout(/layout/basic/layout.html)-->
<div class="section path">
    <span>현재 위치</span>
    <ol>
        <li><a href="/">홈</a></li>
        <li title="현재 위치"><strong>개인정보처리방침</strong></li>
    </ol>
</div>

<main module="mall_privacy" class="section gInnerMargin jg-info-page jg-privacy-page">
    <!--@css(/css/module/mall/privacy.css)-->

    <div class="jg-info-hero">
        <p class="jg-kicker">Privacy Policy</p>
        <h2>개인정보처리방침</h2>
        <p>개인정보의 수집, 이용, 보관, 파기 및 권리 행사 기준을 확인할 수 있습니다. 아래 내용은 쇼핑몰 운영과 회원 서비스 제공에 적용되는 공식 처리 기준입니다.</p>
    </div>

    <section class="jg-info-band jg-privacy-document">
        <h3>개인정보 처리 기준</h3>
        <p class="date {$displayEnforce|display}">{$enforce_date}</p>
        <div class="ec-base-box typeThin jg-privacy-box">
        <div class="agree">
            {$privacy_agreement}
        </div>
        </div>
        <div class="ec-base-button {$displayBeforeEnforce|display} jg-privacy-history">
            <span class="gLeft">
                <a href="{$before_enforce_link}" class="btnDate" target="_blank">{$before_enforce_date}</a>
            </span>
        </div>
    </section>

    <div class="jg-info-actions">
        <a class="jg-btn jg-btn-primary" href="/shopinfo/guide.html">이용안내 보기</a>
        <a class="jg-btn jg-btn-outline" href="/shopinfo/company.html">회사소개 보기</a>
    </div>
</main>
