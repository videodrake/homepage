<!--@layout(/layout/basic/layout.html)-->
<main class="onroad-page intake-page">
  <section class="jr-masthead" data-header-light>
    <div class="jr-masthead__inner">
      <div>
        <div class="eyebrow">Guide / Intake</div>
        <h1>복잡하지 않게,<br><span class="italic">하루 한 캡슐</span>.</h1>
      </div>
      <aside class="jr-editor-note">
        <b>[ Daily Routine ]</b>
        <p>매일 같은 시간에 섭취하면 루틴으로 이어가기 쉽습니다.</p>
        <small>1 cap / day</small>
      </aside>
    </div>
  </section>
  <section class="section section--cream" data-header-light>
    <div class="container">
      <div class="counter-row">
        <div class="counter" data-ord="01"><div class="counter__num">1<sub>cap</sub></div><div class="counter__unit">하루 한 번</div><div class="counter__k">섭취량</div></div>
        <div class="counter" data-ord="02"><div class="counter__num">40<sub>mg</sub></div><div class="counter__unit">옥타코사놀</div><div class="counter__k">기능성 원료</div></div>
        <div class="counter" data-ord="03"><div class="counter__num">60<sub>days</sub></div><div class="counter__unit">한 통 구성</div><div class="counter__k">루틴 기간</div></div>
        <div class="counter" data-ord="04"><div class="counter__num">AM</div><div class="counter__unit">권장 시점</div><div class="counter__k">아침 루틴</div></div>
      </div>
    </div>
  </section>
</main>
