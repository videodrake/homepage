name: Deploy redesign preview to Pages

# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Then run this workflow (Actions tab -> this workflow -> Run workflow), or ask Claude to trigger it.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload redesign as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: project/redesign
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
